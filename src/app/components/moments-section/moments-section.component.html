<section class="life-section moments-section" id="casa" aria-labelledby="casa-title">
  <div class="section-heading reveal">
    <p class="eyebrow">{{ moments.eyebrow }}</p>
    <h2 id="casa-title">{{ moments.title }}<br><span>{{ moments.subtitle }}</span></h2>
  </div>

  <div class="moments-essay">
    <!-- Acto I: Vulnerabilidad y Amor Fraterno -->
    <div class="moments-chapter moments-chapter-duo">
      <figure class="moment-card moment-card-tall reveal">
        <div class="moment-media">
          <img [src]="moments.items[0].image" [alt]="moments.items[0].alt" loading="lazy" class="moment-img">
          <span class="moment-index">{{ moments.items[0].id }}</span>
        </div>
        <figcaption class="moment-caption">
          <span class="moment-tag">{{ moments.items[0].tag }}</span>
          <strong class="moment-name">{{ moments.items[0].title }}</strong>
          <p>{{ moments.items[0].caption }}</p>
        </figcaption>
      </figure>

      <div class="moment-duo-side">
        <blockquote class="editorial-interlude reveal">
          <em>«Nadie camina solo.»</em>
          <p>La Casa existe para sostenernos cuando el paso pesa, y para celebrar juntos cuando abunda la bendición.</p>
        </blockquote>

        <figure class="moment-card moment-card-wide reveal">
          <div class="moment-media">
            <img [src]="moments.items[1].image" [alt]="moments.items[1].alt" loading="lazy" class="moment-img">
            <span class="moment-index">{{ moments.items[1].id }}</span>
          </div>
          <figcaption class="moment-caption">
            <span class="moment-tag">{{ moments.items[1].tag }}</span>
            <strong class="moment-name">{{ moments.items[1].title }}</strong>
            <p>{{ moments.items[1].caption }}</p>
          </figcaption>
        </figure>
      </div>
    </div>

    <!-- Acto II: La Mesa y la Conversación -->
    <div class="moments-chapter moments-chapter-split">
      <figure class="moment-card moment-card-medium reveal">
        <div class="moment-media">
          <img [src]="moments.items[2].image" [alt]="moments.items[2].alt" loading="lazy" class="moment-img">
          <span class="moment-index">{{ moments.items[2].id }}</span>
        </div>
        <figcaption class="moment-caption">
          <span class="moment-tag">{{ moments.items[2].tag }}</span>
          <strong class="moment-name">{{ moments.items[2].title }}</strong>
          <p>{{ moments.items[2].caption }}</p>
        </figcaption>
      </figure>

      <figure class="moment-card moment-card-medium offset-top reveal">
        <div class="moment-media">
          <img [src]="moments.items[3].image" [alt]="moments.items[3].alt" loading="lazy" class="moment-img">
          <span class="moment-index">{{ moments.items[3].id }}</span>
        </div>
        <figcaption class="moment-caption">
          <span class="moment-tag">{{ moments.items[3].tag }}</span>
          <strong class="moment-name">{{ moments.items[3].title }}</strong>
          <p>{{ moments.items[3].caption }}</p>
        </figcaption>
      </figure>
    </div>

    <!-- Cita central de Casa -->
    <blockquote class="story-quote story-quote-center reveal">
      La Casa no termina cuando termina la reunión.
    </blockquote>

    <!-- Acto III: Generaciones y Vida Real -->
    <div class="moments-chapter moments-chapter-trio">
      <figure class="moment-card reveal">
        <div class="moment-media">
          <img [src]="moments.items[4].image" [alt]="moments.items[4].alt" loading="lazy" class="moment-img">
          <span class="moment-index">{{ moments.items[4].id }}</span>
        </div>
        <figcaption class="moment-caption">
          <span class="moment-tag">{{ moments.items[4].tag }}</span>
          <strong class="moment-name">{{ moments.items[4].title }}</strong>
          <p>{{ moments.items[4].caption }}</p>
        </figcaption>
      </figure>

      <figure class="moment-card offset-top-small reveal">
        <div class="moment-media">
          <img [src]="moments.items[5].image" [alt]="moments.items[5].alt" loading="lazy" class="moment-img">
          <span class="moment-index">{{ moments.items[5].id }}</span>
        </div>
        <figcaption class="moment-caption">
          <span class="moment-tag">{{ moments.items[5].tag }}</span>
          <strong class="moment-name">{{ moments.items[5].title }}</strong>
          <p>{{ moments.items[5].caption }}</p>
        </figcaption>
      </figure>

      <figure class="moment-card reveal">
        <div class="moment-media">
          <img [src]="moments.items[6].image" [alt]="moments.items[6].alt" loading="lazy" class="moment-img">
          <span class="moment-index">{{ moments.items[6].id }}</span>
        </div>
        <figcaption class="moment-caption">
          <span class="moment-tag">{{ moments.items[6].tag }}</span>
          <strong class="moment-name">{{ moments.items[6].title }}</strong>
          <p>{{ moments.items[6].caption }}</p>
        </figcaption>
      </figure>
    </div>

    <!-- Acto IV: Clímax de Adoración Cinematográfica -->
    <div class="moments-chapter moments-chapter-cinema reveal">
      <figure class="moment-card moment-card-cinema">
        <div class="moment-media cinema-aspect">
          <img [src]="moments.items[7].image" [alt]="moments.items[7].alt" loading="lazy" class="moment-img">
          <span class="moment-index">{{ moments.items[7].id }}</span>
          <div class="cinema-overlay">
            <span class="moment-tag">{{ moments.items[7].tag }}</span>
            <strong class="moment-name">{{ moments.items[7].title }}</strong>
            <p>{{ moments.items[7].caption }}</p>
          </div>
        </div>
      </figure>
    </div>
  </div>
</section>
