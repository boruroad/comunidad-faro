<app-site-header
  [facebookUrl]="facebookUrl"
  [menuOpen]="menuOpen"
  [headerScrolled]="headerScrolled"
  (toggleMenu)="toggleMenu()"
  (closeMenu)="closeMenu()"
></app-site-header>

<main id="contenido" class="auth-page">
  <section class="auth-panel" aria-labelledby="login-title">
    <p class="eyebrow">ACCESO INTERNO</p>
    <h1 id="login-title">INICIAR SESION</h1>
    <p class="auth-copy">Ingresa con tu cuenta de Comunidad FARO.</p>

    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label for="login-email">Correo</label>
      <input id="login-email" type="email" formControlName="email" autocomplete="email" placeholder="tu@correo.com">

      <label for="login-password">Contraseña</label>
      <div class="password-field">
        <input id="login-password" [type]="showPassword() ? 'text' : 'password'" formControlName="password" autocomplete="current-password" placeholder="••••••••••••">
        <button
          type="button"
          class="password-toggle"
          (click)="togglePasswordVisibility()"
          [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          [attr.aria-pressed]="showPassword()"
        >
          @if (showPassword()) {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 3l18 18"></path>
              <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
              <path d="M9.9 5.1A10.4 10.4 0 0 1 12 5c6 0 10 6 10 6a13.6 13.6 0 0 1-2.2 2.9M6.6 6.6C3.9 8.4 2 12 2 12s4 6 10 6c1 0 2-.2 3-.5"></path>
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6-10-6-10-6z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          }
        </button>
      </div>

      @if (errorMessage()) {
        <p class="auth-error" aria-live="polite">{{ errorMessage() }}</p>
      }

      <button class="button button-dark" type="submit" [disabled]="loading()">
        {{ loading() ? 'Ingresando...' : 'Entrar' }}
      </button>

      <a class="text-link" routerLink="/recuperar-password">¿Olvidaste tu contraseña?</a>
      <a class="text-link" routerLink="/crear-cuenta">Crear una cuenta</a>
      <a class="text-link" routerLink="/">Volver al inicio</a>
    </form>

    <p class="auth-copy" style="margin-top: 1.5rem; font-size: 0.78rem;">
      Si acabas de crear tu cuenta, un administrador debe activarla antes de que puedas ingresar.
    </p>
  </section>
</main>
