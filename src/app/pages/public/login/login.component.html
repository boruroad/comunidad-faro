<app-site-header
  [facebookUrl]="facebookUrl"
  [menuOpen]="menuOpen"
  [headerScrolled]="headerScrolled"
  (toggleMenu)="toggleMenu()"
  (closeMenu)="closeMenu()"
></app-site-header>

<main id="contenido" class="auth-page">
  <section class="auth-panel" aria-labelledby="login-title">
    <p class="eyebrow">ACCESO INTERNO</p>
    <h1 id="login-title">INICIAR SESION</h1>
    <p class="auth-copy">Ingresa con tu cuenta para administrar Comunidad FARO.</p>

    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label for="login-email">Correo</label>
      <input id="login-email" type="email" formControlName="email" autocomplete="email" placeholder="tu@correo.com">

      <label for="login-password">Contraseña</label>
      <input id="login-password" type="password" formControlName="password" autocomplete="current-password" placeholder="••••••••••••">

      @if (errorMessage()) {
        <p class="auth-error" aria-live="polite">{{ errorMessage() }}</p>
      }

      <button class="button button-dark" type="submit" [disabled]="loading()">
        {{ loading() ? 'Ingresando...' : 'Entrar' }}
      </button>

      <a class="text-link" routerLink="/">Volver al inicio</a>
    </form>
  </section>
</main>
